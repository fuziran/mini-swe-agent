name: Pytest

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Run pytest and save its raw output
        run: |
          set -o pipefail
          python -m pytest -q --color=no -p no:cacheprovider 2>&1 | tee pytest.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pytest-log
          path: pytest.log
          if-no-files-found: error
