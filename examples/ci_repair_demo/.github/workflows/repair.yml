name: Repair failed pytest

on:
  workflow_run:
    workflows: [Pytest]
    types: [completed]

jobs:
  repair:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'failure' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_branch == 'main' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPAIR_MODEL: deepseek/deepseek-flash
      REPAIR_IMAGE: mini-swe-agent-repository:latest
      REPAIR_TIMEOUT: '600'
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          name: pytest-log
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}
          path: ci-log
      - name: Install the repair agent
        env:
          AGENT_REPO: ${{ vars.AGENT_REPO }}
          AGENT_REF: ${{ vars.AGENT_REF }}
        run: |
          test -n "$AGENT_REPO"
          [[ "$AGENT_REF" =~ ^[0-9a-f]{40}$ ]]
          git clone --quiet "https://github.com/$AGENT_REPO.git" "$RUNNER_TEMP/agent"
          git -C "$RUNNER_TEMP/agent" fetch --quiet origin "$AGENT_REF"
          git -C "$RUNNER_TEMP/agent" checkout --quiet --detach FETCH_HEAD
          python -m pip install "$RUNNER_TEMP/agent"
          docker build -q -t "$REPAIR_IMAGE" -f "$RUNNER_TEMP/agent/Dockerfile.repository" "$RUNNER_TEMP/agent"
      - name: Record repair runtime and configuration
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from pathlib import Path

          import yaml

          def output(*args: str) -> str:
              return subprocess.run(args, check=True, capture_output=True, text=True).stdout.strip()

          agent = Path(os.environ["RUNNER_TEMP"]) / "agent"
          image = os.environ["REPAIR_IMAGE"]
          result = Path(os.environ["RUNNER_TEMP"]) / "repair-result"
          result.mkdir(exist_ok=True)
          (result / "runtime.json").write_text(json.dumps({
              "agent_sha": output("git", "-C", str(agent), "rev-parse", "HEAD"),
              "failed_sha": os.environ["FAILED_SHA"],
              "failed_run_id": int(os.environ["FAILED_RUN_ID"]),
              "ci_test_runtime": (Path("ci-log") / "pytest-versions.txt").read_text().splitlines(),
              "runner_python": output("python", "--version"),
              "image": {
                  "name": image,
                  "id": output("docker", "image", "inspect", image, "--format", "{{.Id}}"),
                  "python": output("docker", "run", "--rm", "--network", "none", image, "python", "--version"),
                  "pytest": output("docker", "run", "--rm", "--network", "none", image, "python", "-m", "pytest", "--version"),
                  "base_image": (agent / "Dockerfile.repository").read_text().splitlines()[0].split(maxsplit=1)[1],
                  "packages": output("docker", "run", "--rm", "--network", "none", image,
                                     "python", "-m", "pip", "freeze").splitlines(),
                  "dockerfile_sha256": hashlib.sha256((agent / "Dockerfile.repository").read_bytes()).hexdigest(),
              },
              "base_config": yaml.safe_load((agent / "src/minisweagent/config/repository.yaml").read_text()),
              "cli_options": {"workflow": "Pytest", "model": os.environ["REPAIR_MODEL"],
                              "image": image, "timeout": int(os.environ["REPAIR_TIMEOUT"])},
          }, indent=2) + "\n")
          PY
      - name: Reproduce, repair, and verify in separate Docker containers
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test -n "$DEEPSEEK_API_KEY"
          python -m minisweagent.run.ci_repair \
            --repo "$GITHUB_WORKSPACE" \
            --workflow Pytest \
            --run-id "$FAILED_RUN_ID" \
            --sha "$FAILED_SHA" \
            --log "$GITHUB_WORKSPACE/ci-log/pytest.log" \
            --xml "$GITHUB_WORKSPACE/ci-log/pytest.xml" \
            --output "$RUNNER_TEMP/repair-result" \
            --model "$REPAIR_MODEL" \
            --image "$REPAIR_IMAGE" \
            --timeout "$REPAIR_TIMEOUT"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repair-result
          path: ${{ runner.temp }}/repair-result
          if-no-files-found: warn

  publish:
    needs: repair
    if: needs.repair.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: repair-result
          path: repair-result
      - name: Validate the verified patch before publishing
        env:
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          python - <<'PY'
          import json
          import os
          import subprocess
          from pathlib import Path

          def git(*args: str) -> bytes:
              return subprocess.run(["git", *args], check=True, capture_output=True).stdout

          def require(condition: bool, message: str) -> None:
              if not condition:
                  raise SystemExit(message)

          report = json.loads(Path("repair-result/report.json").read_text())
          sha = os.environ["FAILED_SHA"]
          require(report.get("status") == "verified", "Repair was not verified")
          require(report.get("sha") == sha and report.get("workflow") == "Pytest", "Repair source mismatch")
          require(str(report.get("run_id")) == os.environ["FAILED_RUN_ID"], "Repair run mismatch")
          require(git("rev-parse", "HEAD").strip().decode() == sha, "Checkout does not match failed commit")
          require(not git("diff", "--cached", "--name-only", "-z"), "Checkout has staged changes")
          subprocess.run(["git", "fetch", "--quiet", "origin", "main"], check=True)
          require(git("rev-parse", "FETCH_HEAD").strip().decode() == sha, "Main has advanced")

          patch_paths = [entry.split(b"\t", 2)[2] for entry in
                         git("apply", "--numstat", "-z", "repair-result/patch.diff").split(b"\0") if entry]
          require(
              patch_paths and all(path.startswith(b"src/") and path.endswith(b".py") for path in patch_paths),
              "Patch contains a disallowed path",
          )
          untracked = set(git("ls-files", "--others", "--exclude-standard", "-z").split(b"\0"))
          subprocess.run(["git", "apply", "--check", "repair-result/patch.diff"], check=True)
          subprocess.run(["git", "apply", "repair-result/patch.diff"], check=True)
          require(
              set(git("ls-files", "--others", "--exclude-standard", "-z").split(b"\0")) == untracked,
              "Patch created untracked files",
          )
          entries = git("diff", "HEAD", "--raw", "--no-renames", "-z").split(b"\0")
          entries.pop()
          require(len(entries) % 2 == 0, "Invalid diff metadata")
          paths = []
          for metadata, path in zip(entries[::2], entries[1::2]):
              fields = metadata.split()
              require(
                  len(fields) == 5 and fields[-1] == b"M"
                  and fields[0][1:] == fields[1] and fields[1] in {b"100644", b"100755"}
                  and path.startswith(b"src/") and path.endswith(b".py"),
                  "Patch changes a disallowed path or file type",
              )
              paths.append(path.decode())
          require(
              paths and sorted(paths) == sorted(path.decode() for path in patch_paths)
              == sorted(report.get("changed_files", [])),
              "Patch differs from report",
          )
          subprocess.run(["git", "diff", "--check"], check=True)
          subprocess.run(["git", "add", "--", *paths], check=True)
          PY
      - name: Check for an existing repair PR
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          branch="ci-repair/${FAILED_SHA:0:12}"
          existing_pr="$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')"
          if test -n "$existing_pr"; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Repair PR #$existing_pr already exists for $FAILED_SHA; no new patch published"
          fi
      - name: Create a draft PR from the verified patch
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          FAILED_SHA: ${{ github.event.workflow_run.head_sha }}
          FAILED_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          git fetch --quiet origin main
          test "$(git rev-parse FETCH_HEAD)" = "$FAILED_SHA"
          git diff --cached --check
          branch="ci-repair/${FAILED_SHA:0:12}"
          existing_pr="$(gh pr list --state all --head "$branch" --json number --jq '.[0].number // empty')"
          if test -n "$existing_pr"; then
            echo "Repair PR #$existing_pr already exists for $FAILED_SHA; no new patch published"
            exit 0
          fi
          if git ls-remote --exit-code origin "refs/heads/$branch" >/dev/null 2>&1; then
            git fetch --quiet origin "$branch"
            test "$(git rev-parse 'FETCH_HEAD^{tree}')" = "$(git write-tree)"
          else
            git switch -c "$branch"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git commit -m 'fix(run): repair reproducible pytest failure'
            git push --set-upstream origin "$branch"
          fi
          cat > "$RUNNER_TEMP/pr-body.md" <<EOF
          ## Independent verification

          - Failed commit: $FAILED_SHA
          - Original Pytest run: https://github.com/$GITHUB_REPOSITORY/actions/runs/$FAILED_RUN_ID
          - Reproduced failing tests: $(jq -r '.baseline_failures | join(", ")' repair-result/report.json)
          - Original failing run output: baseline.log in the repair evidence artifact
          - Failed tests after patch: $(tail -n 1 repair-result/target.log)
          - Full test suite after patch: $(tail -n 1 repair-result/candidate.log)
          - Changed source files: $(jq -r '.changed_files | join(", ")' repair-result/report.json)
          - Change check: patch applied cleanly; only src/*.py was staged
          - Model calls: $(jq -r .model_calls repair-result/report.json)
          - Model cost (USD): $(jq -r .model_cost repair-result/report.json)
          - Repair duration (seconds): $(jq -r .duration_seconds repair-result/report.json)
          - Repair evidence (logs, diff, trajectory, report): https://github.com/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID

          Review the patch before merging.
          EOF
          gh pr create --draft --base main --head "$branch" \
            --title "fix: repair pytest failure at ${FAILED_SHA:0:12}" \
            --body-file "$RUNNER_TEMP/pr-body.md"
